# Build APK Android + bản web mỗi lần push, để cài thử trên điện thoại
# mà không cần bật gỡ lỗi USB.
#   - APK: trang Releases, mỗi nhánh một bản (tag build-<tên nhánh>).
#   - Web: GitHub Pages (chỉ nhánh main).
name: Build thử trên điện thoại

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.2
  GODOT_RELEASE: stable

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Tải Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          URL="https://github.com/godotengine/godot/releases/download/$V"
          mkdir -p ~/godot && cd ~/godot
          curl -sSLO "$URL/Godot_v${V}_linux.x86_64.zip"
          curl -sSLO "$URL/Godot_v${V}_export_templates.tpz"
          unzip -q "Godot_v${V}_linux.x86_64.zip" && rm "Godot_v${V}_linux.x86_64.zip"
          mv "Godot_v${V}_linux.x86_64" godot

      - name: Cài Godot
        run: |
          V="${GODOT_VERSION}.${GODOT_RELEASE}"
          TPL=~/.local/share/godot/export_templates/$V
          mkdir -p "$TPL"
          unzip -q -o ~/godot/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TPL/"
          echo "$HOME/godot" >> "$GITHUB_PATH"
          # Chỉ cho Godot chỗ Android SDK và JDK có sẵn trên máy build.
          MAJOR_MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-$MAJOR_MINOR.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project
        run: godot --headless --path . --import

      - name: Xuất APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.github/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p export
          godot --headless --path . --export-debug "Android" export/DauTuong.apk
          test -s export/DauTuong.apk

      - name: Xuất bản web
        run: |
          mkdir -p export/web
          godot --headless --path . --export-release "Web" export/web/index.html
          test -s export/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: DauTuong-apk
          path: export/DauTuong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: export/web

      - name: Đăng APK lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="build-$(echo "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          NOTES="Bản thử tự động từ nhánh \`$BRANCH\`, commit ${GITHUB_SHA::7}.
          Mở link này bằng trình duyệt trên điện thoại, tải DauTuong.apk và cài."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" export/DauTuong.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Bản thử: $BRANCH (${GITHUB_SHA::7})" --notes "$NOTES"
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/DauTuong.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Chuẩn bị GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  pages:
    # Cần bật một lần: Settings > Pages > Source: GitHub Actions.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tải Godot
        run: |
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          curl -sSLO "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip"
          unzip -q "Godot_v${V}_linux.x86_64.zip"
          mv "Godot_v${V}_linux.x86_64" /usr/local/bin/godot
      - run: godot --headless --path . --import
      - run: godot --headless --path . -s tests/run_tests.gd
      - run: godot --headless --path . -s tests/smoke_match.gd
